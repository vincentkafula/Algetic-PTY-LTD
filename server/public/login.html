<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommHub — Log in</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="nav">
  <div class="brand"><span class="dot"></span> CommHub</div>
  <div class="links">
    <a href="index.html">Home</a>
  </div>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-tabs">
      <button id="tabLogin" class="auth-tab active" onclick="showTab('login')">Log in</button>
      <button id="tabSignup" class="auth-tab" onclick="showTab('signup')">Create account</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="auth-form" onsubmit="return handleLogin(event)">
      <label>Email</label>
      <input type="email" id="loginEmail" required autocomplete="email" />
      <label>Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password" />
      <button type="submit" class="primary" style="width:100%;margin-top:8px">Log in</button>
      <div id="loginError" class="auth-error"></div>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="auth-form" style="display:none" onsubmit="return handleSignup(event)">
      <label>Company name (optional)</label>
      <input type="text" id="signupCompany" autocomplete="organization" />
      <label>Email</label>
      <input type="email" id="signupEmail" required autocomplete="email" />
      <label>Password</label>
      <input type="password" id="signupPassword" required minlength="8" autocomplete="new-password" />
      <p class="hint">At least 8 characters.</p>
      <button type="submit" class="primary" style="width:100%;margin-top:8px">Create account</button>
      <div id="signupError" class="auth-error"></div>
    </form>
  </div>
</div>

<script src="auth.js"></script>
<script>
  if (getToken()) window.location.href = 'dashboard.html';

  function showTab(which) {
    document.getElementById('tabLogin').classList.toggle('active', which === 'login');
    document.getElementById('tabSignup').classList.toggle('active', which === 'signup');
    document.getElementById('loginForm').style.display = which === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = which === 'signup' ? 'block' : 'none';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Login failed'; return false; }
      setSession(data.token, data.user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errEl.textContent = err.message;
    }
    return false;
  }

  async function handleSignup(e) {
    e.preventDefault();
    const errEl = document.getElementById('signupError');
    errEl.textContent = '';
    const companyName = document.getElementById('signupCompany').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    try {
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, companyName: companyName || undefined })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Sign up failed'; return false; }
      setSession(data.token, data.user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errEl.textContent = err.message;
    }
    return false;
  }
</script>
</body>
</html>
