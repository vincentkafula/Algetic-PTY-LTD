services:
  kamailio:
    build: ./kamailio
    container_name: commhub-kamailio
    # Host networking, not bridge — SIP/RTP need a real, stable public IP
    # and a wide UDP port range that Docker's default bridge+NAT networking
    # can't cleanly forward. This is the standard, widely-used pattern for
    # dockerized SIP servers (Kamailio, rtpengine), not a shortcut.
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persists the subscriber/registration database across container
      # restarts and rebuilds. Back this file up — losing it means losing
      # every subscriber account.
      - kamailio-data:/etc/kamailio

  rtpengine:
    build: ./rtpengine
    container_name: commhub-rtpengine
    network_mode: host
    restart: unless-stopped
    env_file: .env
    # Needed for rtpengine to manage its own network resources even in
    # userspace (non-kernel-module) mode.
    cap_add:
      - NET_ADMIN

volumes:
  kamailio-data:
