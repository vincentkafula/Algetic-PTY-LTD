services:
  kamailio:
    build: ./kamailio
    container_name: altegic-kamailio
    # Host networking, not bridge — SIP/RTP need a real, stable public IP
    # and a wide UDP port range that Docker's default bridge+NAT networking
    # can't cleanly forward. This is the standard, widely-used pattern for
    # dockerized SIP servers (Kamailio, rtpengine), not a shortcut.
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persists the subscriber/registration database across container
      # restarts and rebuilds. Back this file up — losing it means losing
      # every subscriber account.
      - kamailio-data:/etc/kamailio

  rtpengine:
    build: ./rtpengine
    container_name: altegic-rtpengine
    network_mode: host
    restart: unless-stopped
    env_file: .env
    # Needed for rtpengine to manage its own network resources even in
    # userspace (non-kernel-module) mode.
    cap_add:
      - NET_ADMIN

  api:
    build: ./api
    container_name: altegic-sip-api
    restart: unless-stopped
    env_file: .env
    # Regular bridge networking is fine here (unlike kamailio/rtpengine) —
    # this service only speaks plain HTTP on one port, no SIP/RTP involved.
    # Not exposed directly to the internet; only Caddy talks to it.
    expose:
      - "3000"
    volumes:
      # Same volume as kamailio, so this service reads/writes the exact
      # same subscriber database Kamailio itself uses.
      - kamailio-data:/etc/kamailio

  caddy:
    image: caddy:2
    container_name: altegic-sip-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  kamailio-data:
  caddy-data:
  caddy-config:
